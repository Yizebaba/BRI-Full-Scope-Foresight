name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://services9.arcgis.com/weJ1QsnbMYJlCHdG/ArcGIS/rest/services
          curl -s "$B?f=json" | python3 -c 'import json,sys;d=json.load(sys.stdin);[print(s) for s in d.get("services",[]) if "hokepoint" in s["name"]]'
          curl -s "$B/Daily_Chokepoints_Data/FeatureServer/0?f=json" | head -c 400; echo
          curl -s "https://portwatch.imf.org/api/search/v1/collections" | python3 -c 'import json,sys;d=json.load(sys.stdin);[print(c.get("id"),c.get("title")) for c in d.get("collections",[])]' | head -20
          curl -s "https://portwatch.imf.org/api/search/v1/collections" | head -c 300; echo
