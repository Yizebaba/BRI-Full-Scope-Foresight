name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://services9.arcgis.com/weJ1QsnbMYJlCHdG/ArcGIS/rest/services
          curl -s "$B?f=json" | python3 -c 'import json,sys;d=json.load(sys.stdin);print([s["name"] for s in d.get("services",[]) if "hoke" in s["name"] or "Port" in s["name"]]);print(str(d)[:300])'
          for s in Daily_Chokepoints_Data Daily_Ports_Data; do echo "== $s"; curl -s "$B/$s/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json" | head -c 300; echo; curl -s "$B/$s/FeatureServer?f=json" | head -c 300; echo; done
          curl -s "https://portwatch.imf.org/api/search/v1?q=chokepoint" | head -c 500; echo
